services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      CACHE_DIR: /cache
    volumes:
      - song-cache:/cache
    expose:
      - "3000"

  caddy:                       # HTTPS אוטומטי (תעודה חינמית מ-Let's Encrypt)
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  song-cache:
  caddy-data:
  caddy-config:
