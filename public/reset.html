<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מרעננים את האתר</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;font-family:system-ui,Arial,sans-serif;background:#FFF3EA;color:#1B1033;padding:24px}</style>
</head>
<body>
<main><h1>מרעננים את האתר...</h1><p id="s">רגע אחד</p></main>
<script>
(async () => {
  const s = document.getElementById('s');
  try {
    if ('serviceWorker' in navigator) {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const ks = await caches.keys();
      await Promise.all(ks.filter(k => k !== 'yallah-songs').map(k => caches.delete(k)));
    }
    s.textContent = 'סיימנו! עוברים לאתר...';
  } catch (e) { s.textContent = 'עוברים לאתר...'; }
  setTimeout(() => location.replace('/?r=' + Date.now()), 900);
})();
</script>
</body>
</html>
