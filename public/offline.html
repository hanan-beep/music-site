<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>אין חיבור לאינטרנט</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; color: #1B1033; background: #FFF3EA; }
    .logo { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 10px 30px rgba(221,36,118,.35); }
    h1 { margin: 20px 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: rgba(27,16,51,.65); }
    a, button { display: inline-block; margin: 4px; padding: 12px 26px; border: 0; border-radius: 999px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .main { color: #fff; background: linear-gradient(135deg, #FF512F, #DD2476); }
    .sec { color: #1B1033; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.png" alt="" />
    <h1>אין חיבור לאינטרנט</h1>
    <p>שירים ששמרתם במכשיר ממשיכים לנגן גם עכשיו.</p>
    <a class="main" href="/downloads">השירים השמורים שלי</a>
    <button class="sec" onclick="location.reload()">נסו שוב</button>
  </main>
</body>
</html>
